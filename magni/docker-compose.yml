services:
  magni:
    build:
      context: .
      dockerfile: Dockerfile
    # Keep the app off the NAS LAN. Attach cloudflared to swole-network and use
    # http://magni:42069 as its service URL.
    expose:
      - "42069"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    # volumes:
      # Mount logs directory for debugging (disabled due to SMB permission issues)
      # - /mnt/your-pool/docker-logs/swole-experience:/var/log/nginx
    networks:
      - swole-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:42069/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  swole-network:
    driver: bridge


